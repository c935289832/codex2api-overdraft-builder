name: Restore original HF runtime

on:
  workflow_dispatch:

concurrency:
  group: codex2api-overdraft-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugging Face client
        run: python -m pip install --disable-pip-version-check 'huggingface_hub>=1.0,<2'
      - name: Test restoration helper
        run: python -m unittest -v test_restore_original.py
      - name: Restore original runtime and verify live health
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python restore_original.py
      - name: Read failed build log
        if: failure()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          curl -fsS --max-time 20 -H "Authorization: Bearer ${HF_TOKEN}" \
            'https://huggingface.co/api/spaces/axm0121/SelfCodex2api/logs/build' > build.log || test "$?" = 28
          tail -c 20000 build.log
